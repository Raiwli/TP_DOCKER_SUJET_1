upstream users_service {
    server users-api:5001;
}

upstream products_service {
    server products-api:5002;
}

upstream orders_service {
    server orders-api:5003;
}

server {
    listen 80;
    server_name localhost;

    location /api/users {
        proxy_pass http://users_service/users;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/products {
        proxy_pass http://products_service/products;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/orders {
        proxy_pass http://orders_service/orders;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        return 200 '{"status": "gateway healthy"}';
        add_header Content-Type application/json;
    }
}
